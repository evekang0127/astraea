<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<title>Startrek_SpaceGame</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#status { background: radial-gradient(ellipse at center, #0b1530 0%, #02040a 70%) !important; }
#status-splash { display: none !important; }
#status-progress { -webkit-appearance: none; appearance: none; height: 3px; bottom: 18% !important; width: 36% !important; border: 0; background: rgba(120,200,255,.18); border-radius: 2px; }
#status-progress::-webkit-progress-bar { background: rgba(120,200,255,.18); }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg,#38d8ff,#d8f6ff); box-shadow: 0 0 8px #38d8ff; }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg,#38d8ff,#d8f6ff); }
#warpStars { position: absolute; inset: 0; width: 100%; height: 100%; }
#warpText { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; font: 600 15px 'Noto Sans KR','Malgun Gothic',sans-serif; letter-spacing: 6px; color: #bfe9ff; text-shadow: 0 0 10px #38d8ff; }
#arriveFx { position: fixed; inset: 0; background: #fff; z-index: 50; pointer-events: none; transition: opacity 1.4s ease; }
</style>

		<canvas id="canvas">

		</canvas>

			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<canvas id="warpStars"></canvas><div id="warpText">WARP · 우주로 이동 중</div><img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		
<script>
// 워프 빛줄기(로딩 동안): 가운데에서 바깥으로 뻗는 별줄기
(function () {
  const c = document.getElementById('warpStars'); if (!c) return; const g = c.getContext('2d'); const N = 260, st = [];
  for (let i = 0; i < N; i++) st.push({ a: Math.random() * Math.PI * 2, r: Math.random(), v: 0.4 + Math.random() * 1.4 });
  let last = performance.now();
  (function f(now) {
    if (!c.isConnected) return; const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const w = c.width = innerWidth, h = c.height = innerHeight, cx = w / 2, cy = h / 2, R = Math.hypot(cx, cy);
    g.clearRect(0, 0, w, h); g.lineCap = 'round';
    for (const s of st) { s.r += s.v * dt * (0.3 + s.r * 1.6); if (s.r > 1) { s.r = Math.random() * 0.05; s.a = Math.random() * Math.PI * 2; }
      const r0 = s.r * R, r1 = r0 + 6 + s.r * s.r * 90; g.strokeStyle = `rgba(${190 + s.r * 60},${225},255,${Math.min(1, s.r * 2)})`; g.lineWidth = 0.6 + s.r * 2;
      g.beginPath(); g.moveTo(cx + Math.cos(s.a) * r0, cy + Math.sin(s.a) * r0); g.lineTo(cx + Math.cos(s.a) * r1, cy + Math.sin(s.a) * r1); g.stroke(); }
    requestAnimationFrame(f);
  })(last);
  // ASTRAEA에서 워프해 들어옴: 하얀 화면에서 밝아짐
  let trip = null; try { trip = JSON.parse(sessionStorage.getItem('astraea-space-trip')); } catch (e) {}
  if (trip && Date.now() - (trip.t || 0) < 120000) { const d = document.createElement('div'); d.id = 'arriveFx'; document.body.appendChild(d); requestAnimationFrame(() => requestAnimationFrame(() => { d.style.opacity = '0'; })); setTimeout(() => d.remove(), 1800); }
})();
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":391016,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
