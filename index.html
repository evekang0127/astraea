<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRAEA</title>
<style>html,body{margin:0;height:100%;background:#05070d;color:#c8b27a;font:14px system-ui,sans-serif}body{display:grid;place-items:center}</style>
</head>
<body>
<div id="boot">ASTRAEA 불러오는 중…</div>
<script>
// 최신 버전 불러오기: GitHub Pages는 파일을 10분까지 캐시하므로, 이 작은 시작 파일이 매번 game.html을
// 캐시 없이 새로 받아 그대로 띄움 → 업데이트 직후 새로고침만 해도 바로 최신판 (주소·#맵·Google 로그인 그대로)
fetch('game.html?t=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => { location.replace('game.html' + location.hash); });
</script>
</body>
</html>
